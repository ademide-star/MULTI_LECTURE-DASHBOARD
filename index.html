<style>

.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:.6rem 1.1rem;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}.btn:hover{background:var(--g2)}
.btn.y{background:var(--y);color:#064}.btn.r{background:#c53030}.btn.s{padding:.3rem .7rem;font-size:.8rem}

.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th{background:var(--g);color:#fff;text-align:left;padding:.55rem .8rem}td{padding:.55rem .8rem;border-top:1px solid var(--b)}
.pre{white-space:pre-wrap;margin:.3rem 0}.reply{border-left:3px solid var(--y);margin:.7rem 0;padding-left:.8rem}details{border-top:1px solid var(--b);padding:.5rem 0}summary{cursor:pointer;font-weight:600}
.login{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:start}.login .hero{margin:0;min-height:100%}

@media(max-width:720px){.login{grid-template-columns:1fr}nav{gap:.8rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* ===== CONFIG: Supabase (table portal_data with columns key text primary, value text, ts bigint) ===== */
const SB_URL='https://ieqfdehnsggdaiiftsvm.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllcWZkZWhuc2dnZGFpaWZ0c3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNzk4MjcsImV4cCI6MjA5NzY1NTgyN30.2L4Fvbfr-y8KpSao3cjmhoDeiniaeSQ6AIqo_E0aAX4';

const REST=SB_URL+'/rest/v1/portal_data',H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},LS='lms_cache';

let LAST='';function sync(ok,msg){const e=document.getElementById('err'),s=document.getElementById('sy');if(ok)LAST=new Date().toLocaleTimeString();if(s){const n=Object.keys(D).filter(k=>k.startsWith('nm_cw_')&&D[k]&&D[k].matric).length;s.textContent=ok?`● Synced ${LAST} · ${n} classwork result${n==1?'':'s'}`:'● Offline';s.style.cursor='pointer';s.title='Click to sync now';s.onclick=()=>tick()}e.style.display=ok?'none':'block';e.textContent=msg||''}
let PEND={};try{PEND=JSON.parse(localStorage.getItem('lms_pending')||'{}')}catch(e){}
const savePend=()=>{try{localStorage.setItem('lms_pending',JSON.stringify(PEND))}catch(e){}};
async function put(k,v){D[k]=v;cache();try{const r=await fetch(REST+'?on_conflict=key',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:k,value:JSON.stringify(v),ts:Date.now()})});if(!r.ok)throw r.status;if(PEND[k]){delete PEND[k];savePend()}}catch(e){PEND[k]=v;savePend();sync(false,'Could not reach the cloud ('+e+'). Your change is saved on this device and will be sent when the connection returns.')}}
async function del(k){delete D[k];cache();try{await fetch(REST+'?key=eq.'+encodeURIComponent(k),{method:'DELETE',headers:H})}catch(e){}}
async function pull(){let all=[],off=0;for(;;){const r=await fetch(REST+`?select=key,value&or=(key.like.lms_*,key.like.nm_cw_*)&order=key.asc&limit=1000&offset=${off}`,{headers:H});if(!r.ok)throw r.status;const b=await r.json();all=all.concat(b);if(b.length<1000)break;off+=1000}
 const n={};all.forEach(x=>{try{n[x.key]=JSON.parse(x.value)}catch(e){}});const ch=JSON.stringify(n)!==JSON.stringify(D);D=n;Object.assign(D,PEND);cache();return ch}
/* ===== APP ===== */
/* ===== BRAND: put your logo file URL in LOGO_URL (for example https://neuromatrixbiosystems.com/logo.png); until then a built-in mark is used ===== */
const LOGO_URL='',AUTHOR='Adebimpe-John Omolola',SITE='https://neuromatrixbiosystems.com';
const LOGO=h=>LOGO_URL?`<img src="${LOGO_URL}" alt="NeuroMatrix Biosystems" height="${h}" style="height:${h}px;width:auto">`:`<svg width="${h}" height="${h}" viewBox="0 0 40 40" role="img" aria-label="NeuroMatrix Biosystems logo"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" stroke="#006847" stroke-width="2.5"/><path d="M12 14 L20 20 L28 13 M20 20 L20 30 M12 27 L20 20 L29 27" stroke="#2D5016" stroke-width="2" fill="none"/><circle cx="12" cy="14" r="2.6" fill="#006847"/><circle cx="28" cy="13" r="2.6" fill="#006847"/><circle cx="20" cy="30" r="2.6" fill="#006847"/><circle cx="12" cy="27" r="2.2" fill="#2D5016"/><circle cx="29" cy="27" r="2.2" fill="#2D5016"/><circle cx="20" cy="20" r="4" fill="#FFB81C"/></svg>`;
const C=[["BIO306","Systematic Biology"],["BIO203","General Physiology"],["MCB221","General Microbiology"],["BIO221","Plant Physiology"],["BIO222","Vertebrate Anatomy and Physiology"],["VOS165","Fruit and Juice"],["VOS265","Fruit and Beverages"]];
const COL=["#006847","#2D5016","#0b6e8a","#7a5a00","#5b3f8c","#b0452b","#8a2d5c"],W=Array.from({length:16},(_,i)=>'Week '+(i+1));
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),nm=c=>(C.find(x=>x[0]==c)||[])[1],mk=m=>String(m).replace(/[^A-Za-z0-9]/g,'-'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let S={view:'login',role:null,name:'',matric:'',code:null,tab:'lecture',week:'Week 1'};
try{const u=JSON.parse(localStorage.getItem('lms_user')||'null');if(u)Object.assign(S,u,{role:'student',view:'dash'})}catch(e){}
const K=(w=S.week)=>S.code+'_W'+(W.indexOf(w)+1),L=()=>S.role=='lect';
function go(v,o={}){Object.assign(S,{view:v},o);render();scrollTo(0,0)}
const table=(h,r)=>`<div class=tw><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
const chips=()=>`<div class=chips>${W.map((w,i)=>`<a class="${w==S.week?'on':''}" onclick="S.week='${w}';render()">${i+1}</a>`).join('')}</div><h3>${S.week}</h3>`;
function render(){
 $('nav').innerHTML=S.view=='login'?`<span class=logo>${LOGO(28)} NeuroMatrix LMS</span>`:`<span class=logo>${LOGO(28)} NeuroMatrix LMS</span><a class="${S.view=='dash'?'on':''}" onclick="go('dash')">Dashboard</a><a onclick="go('dash')">My courses</a><span id=sy></span><span class=av>${esc((L()?'LC':S.name).slice(0,2).toUpperCase())}</span><a onclick="logout()">Log out</a>`;
 $('app').innerHTML=S.view=='login'?vLogin():S.view=='dash'?vDash():vCourse()}
const vLogin=()=>`<div class=login><div class=hero><h2>Sikiru Adetona College of Education, Science and Technology</h2><p>Lectures, attendance, classwork, discussions and announcements in one place.</p></div><div>
<div class=card><h3>Student sign in</h3><label>Full name</label><input id=sn autocomplete=name><label>Matric number</label><input id=sm><button class=btn onclick=stuLogin()>Enter portal</button></div>
<div class=card><h3>Lecturer sign in</h3><label>Course</label><select id=lc>${C.map(c=>`<option value=${c[0]}>${c[0]} · ${c[1]}</option>`).join('')}</select><label>Password</label><input id=lp type=password><button class="btn y" onclick=lecLogin()>Sign in</button><p class=mut id=le></p></div></div></div>`;
function stuLogin(){const n=$('sn').value.trim(),m=$('sm').value.trim();if(!n||!m)return alert('Enter your name and matric number.');try{localStorage.setItem('lms_user',JSON.stringify({name:n,matric:m}))}catch(e){}go('dash',{role:'student',name:n,matric:m})}
function lecLogin(){const c=$('lc').value;if($('lp').value!==(D['lms_pw_'+c]?.pw||'admin123'))return $('le').textContent='Wrong password. Check it and try again.';go('course',{role:'lect',code:c,tab:'lecture'})}
function logout(){try{localStorage.removeItem('lms_user')}catch(e){}go('login',{role:null,name:'',matric:''})}
const attHas=(c,i,m)=>R(`lms_att_${c}_W${i}_`).some(r=>nm_(r.matric)==nm_(m));
const attCount=(c,m)=>W.filter((w,i)=>attHas(c,i+1,m)).length;
function vDash(){const list=L()?C.filter(c=>c[0]==S.code):C;
 return `<h1>Hi, ${L()?'Lecturer':esc(S.name.split(' ')[0])}! 👋</h1><h3>Course overview</h3><div class=grid>${list.map(c=>{const i=C.indexOf(c),n=L()?0:attCount(c[0],S.matric);return `<div class="card cc" tabindex=0 onclick="go('course',{code:'${c[0]}',tab:'lecture'})" onkeydown="if(event.key=='Enter')this.click()"><div class=top style="background:linear-gradient(135deg,${COL[i]},#0008),${COL[i]}">${c[0]}</div><div class=bd><b>${c[1]}</b><span class=mut style="display:block">${AUTHOR}</span>${L()?'<span class=mut>Manage this course</span>':`<div class=bar><i style="width:${n/W.length*100}%"></i></div><span class=mut>${n} of ${W.length} weeks attended</span>`}</div></div>`}).join('')}</div>`}
function vCourse(){const T=[['lecture','Lecture'],['att','Attendance'],['cw','Classwork'],['mst','Mid-semester test'],['disc','Discussion'],['ann','Announcements']];T.push(L()?['grades','Grades & export']:['prog','My progress']);
 const f={lecture:tLec,att:tAtt,cw:tCw,mst:tMst,grades:tGrades,disc:tDisc,ann:tAnn,prog:tProg}[S.tab];
 return `<div class=hero><h2>${S.code} · ${nm(S.code)}</h2><p>${L()?'Lecturer view':esc(S.name)+' · '+esc(S.matric)}</p><p>Course developer: ${AUTHOR}</p></div><div class=tabs>${T.map(t=>`<a class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';render()">${t[1]}</a>`).join('')}</div>${f()}`}
/* Lecture + interactive notes */
const LEC={BIO203:[["Intro to Biology, Matter & Water","water molecule structure animation","water molecule",["https://youtu.be/i5e7V5wkhos"]],["Carbohydrates","carbohydrates structure animation","glucose molecule"],["Lipids","lipids fatty acids phospholipid animation","phospholipid bilayer"],["Proteins","protein structure folding animation","protein structure"],["Nucleic Acids: DNA & RNA","DNA structure replication animation","DNA double helix"],["General Enzymology","enzyme action animation","enzyme"],["Nutrition, Digestion & Absorption","human digestion animation","human digestive system"],["Respiration & ATP Generation","cellular respiration ATP animation","mitochondria"],["Photosynthesis","photosynthesis light reactions animation","chloroplast"],["Protein Synthesis","transcription translation animation","ribosome"],["Cell Membrane Structure & Function","cell membrane transport animation","cell membrane"],["Osmoregulation & Excretion","kidney nephron animation","human kidney"],["Plant Growth Hormones","plant hormones auxin animation","plant cell"],["Homeostasis & Coordination","homeostasis nervous system animation","human brain"],["Circulatory System","human circulatory system animation","human heart"],["Reproduction: Animals & Plants","reproduction animals plants animation","flower anatomy"]],
MCB221:[["Intro & History of Microbiology","history of microbiology animation","bacteria"],["Classification of Organisms","classification of microorganisms animation","microorganism"],["Bacterial Structure & Morphology","bacterial cell structure animation","bacteria cell"],["Fungal Structure & Morphology","fungi structure animation","fungus"],["Viral Structure","virus structure animation","virus"],["Microbial Nutrition & Metabolism","microbial metabolism animation","bacteria"],["Sterilization & Disinfection","sterilization autoclave animation","autoclave"],["Microbiology Laboratory","microbiology laboratory techniques animation","microscope"],["Staining Techniques","gram staining animation","gram positive bacteria"],["Antigens & Antibodies","antibody antigen animation","antibody"],["Microbial Genetics & Variation","bacterial genetics conjugation animation","plasmid"],["Environmental Microbiology","environmental microbiology animation","nitrogen cycle"],["Antimicrobial Agents & AST","antibiotic mechanism animation","petri dish"]]};
function ytId(u){const m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:''}
function vidCards(t){const ls=String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);if(!ls.length)return '';return `<div class=card><h3>🎬 Videos</h3>${ls.map(l=>{const [u,...r]=l.split('|'),url=u.trim(),title=r.join('|').trim(),id=ytId(url);if(id)return `<div style="margin-bottom:1rem">${title?`<p><b>${esc(title)}</b></p>`:''}<div style="position:relative;padding-top:56.25%"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="${esc(title||'Lecture video')}" loading=lazy allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px"></iframe></div><p class=mut><a href="https://www.youtube.com/watch?v=${id}" target=_blank rel=noopener>Open on YouTube</a></p></div>`;return /^https?:\/\//i.test(url)?`<p><a class="btn s" href="${esc(url)}" target=_blank rel=noopener>▶ ${esc(title||url)}</a></p>`:`<p>${esc(l)}</p>`}).join('')}</div>`}
function tLec(){const i=W.indexOf(S.week),sd=(LEC[S.code]||[])[i],l=D['lms_lec_'+K()]||{},en=encodeURIComponent,base=D['lms_url_'+S.code]?.url||NOTES_BASE(S.code),
 topic=l.topic||(sd?sd[0]:''),brief=l.brief||(sd?'Work through the interactive notes for this module, watch the animation, explore the 3D structure, then take the classwork once your lecturer opens it.':''),
 an=sd?'https://www.youtube.com/results?search_query='+en(sd[1]):'',vt=l.vids!==undefined?l.vids:(l.anim||(sd&&sd[3]?sd[3].join('\n'):'')),d3=l.d3||(sd?'https://sketchfab.com/search?q='+en(sd[2])+'&type=models':''),
 ex=S.code=='BIO203'?[['🧍 3D human body (Zygote Body)','https://www.zygotebody.com/'],['🫀 BioDigital Human','https://human.biodigital.com/']]:S.code=='MCB221'?[['🧬 3D molecules (PDB-101)','https://pdb101.rcsb.org/']]:[],
 A=(h,t,c)=>`<a class="btn ${c||'s'}" href="${esc(h)}" target=_blank rel=noopener>${t}</a>`,
 res=`<div class=card><h3>Learning resources</h3><div style="display:flex;gap:.5rem;flex-wrap:wrap">${A(notesUrl(i+1),'📖 Interactive notes (Week '+(i+1)+')','')}${A(notesUrl(''),'All notes','y s')}${an?A(an,'🔎 More animations'):''}${d3?A(d3,'🧊 3D structures'):''}${ex.map(x=>A(x[1],x[0])).join('')}</div></div>${vidCards(vt)}`;
 if(L())return chips()+`<div class=card><label>Topic</label><input id=lt value="${esc(l.topic)}" placeholder="${esc(sd?sd[0]:'')}"><label>Brief</label><textarea id=lb placeholder="${esc(brief)}">${esc(l.brief)}</textarea><label>Assignment</label><textarea id=la>${esc(l.assign)}</textarea><label>Video links (one per line; add a title after | if you like)</label><textarea id=lv placeholder="https://youtu.be/i5e7V5wkhos | Water and life">${esc(vt)}</textarea><label>3D model link (optional)</label><input id=ld value="${esc(l.d3)}" placeholder="https://sketchfab.com/3d-models/..."><button class=btn onclick=saveLec()>Save week</button></div>${res}<div class=card><h3>Course settings</h3><label>Interactive notes link (leave as is to use the default)</label><input id=nu value="${esc(base)}"><label>New lecturer password (optional)</label><input id=np type=password><button class=btn onclick=saveSet()>Save settings</button></div>`;
 return chips()+`<div class=card><h3>📘 ${esc(topic)||'Topic not posted yet'}</h3><p class=pre>${esc(brief)||'No notes posted yet.'}</p></div>${res}<div class=card><h3>📝 Assignment</h3><p class=pre>${esc(l.assign)||'No assignment posted yet.'}</p></div>`}
function saveLec(){put('lms_lec_'+K(),{topic:$('lt').value,brief:$('lb').value,assign:$('la').value,vids:$('lv').value.trim(),d3:$('ld').value.trim()});alert('Saved')}
function saveSet(){put('lms_url_'+S.code,{url:$('nu').value.trim()||NOTES_BASE(S.code)});if($('np').value)put('lms_pw_'+S.code,{pw:$('np').value});alert('Settings saved')}
/* Attendance */
function tAtt(){const k=K(),open=D['lms_atts_'+k]?.open,recs=R(`lms_att_${k}_`).sort((a,b)=>a.ts-b.ts);
 if(L())return chips()+`<div class=card><h3>${S.week} <span class="pill ${open?'on':''}">${open?'Open':'Closed'}</span></h3><button class=btn onclick=togAtt()>${open?'Close':'Open'} attendance</button></div><div class=card><h3>Present (${recs.length})</h3>${recs.length?table(['#','Name','Matric','Time'],recs.map((r,i)=>[i+1,r.name,r.matric,new Date(r.ts).toLocaleTimeString()])):'<p class=mut>No one has marked attendance yet.</p>'}</div>`;
 const me=R(`lms_att_${k}_`).find(r=>nm_(r.matric)==nm_(S.matric));return chips()+`<div class=card>${me?'<div class="al ok">✅ You are marked present.</div>':open?'<button class=btn onclick=mark()>Mark me present</button>':'<div class=al>🔒 Attendance is closed for this week.</div>'}</div>`}

/* Classwork: taken inside the Interactive Notes, results land here */
const fk=s=>String(s).replace(/[\/\.#\$\[\]\s]/g,'__'),cwSt=(c,i)=>fk(`nm_cw_status_${c}_Week ${i}`),cwSub=(c,i,m)=>fk(`nm_cw_${c}_Week ${i}_${m}`);
function notesUrl(n){const base=D['lms_url_'+S.code]?.url||NOTES_BASE(S.code),p=base.split('#')[0];return p+'?n='+encodeURIComponent(S.name||'')+'&m='+encodeURIComponent(S.matric||'')+(n?'#Week'+n:'#')}
const subOf=(c,i,m)=>R(fk(`nm_cw_${c}_Week ${i}_`)).find(r=>r&&r.matric&&nm_(r.matric)==nm_(m))||D[cwSub(c,i,m)];
const mstOf=m=>R(`lms_msts_${S.code}_`).find(r=>nm_(r.matric)==nm_(m));
const cwOpen=(c,i)=>D[cwSt(c,i)]?.is_open===true;
function tCw(){
 if(!L()){const rows=W.map((w,i)=>{const s=subOf(S.code,i+1,S.matric),o=cwOpen(S.code,i+1);return `<tr><td>${w}</td><td>${s?'<span class="pill on">Done</span>':o?'<span class="pill on">Open</span>':'<span class=pill>Closed</span>'}</td><td>${s?`<b>${s.score}/${s.total}</b> (${s.pct}%)`:'—'}</td><td>${!s&&o?`<a class="btn s" href="${esc(notesUrl(i+1))}" target=_blank rel=noopener>Start in notes</a>`:''}</td></tr>`}).join('');
  return `<div class=card><h3>Classwork results</h3><p class=mut>Classwork is taken inside the Interactive Lecture Notes once your lecturer opens it. Your score appears here after you submit.</p><div class=tw><table><tr><th>Week</th><th>Status</th><th>Score</th><th></th></tr>${rows}</table></div></div>`}
 const n=W.indexOf(S.week)+1,o=cwOpen(S.code,n),subs=R(fk(`nm_cw_${S.code}_Week ${n}_`)).sort((a,b)=>String(a.ts).localeCompare(b.ts));
 return chips()+`<div class=card><h3>Access for ${S.week} <span class="pill ${o?'on':''}">${o?'Open':'Closed'}</span></h3><p class=mut>Students can only start this week's classwork in the notes while it is open.</p><button class=btn onclick="togGate(${n})">${o?'Close':'Open'} classwork</button></div><div class=card><h3>Results (${subs.length})</h3>${subs.length?table(['Name','Matric','Score','%','Submitted'],subs.map(s=>[s.name,s.matric,s.score+'/'+s.total,s.pct+'%',new Date(s.ts).toLocaleString()])):'<p class=mut>No submissions yet.</p>'}</div>${allCw()}${diagCard()}`}
function allCw(){const pre=fk(`nm_cw_${S.code}_Week`),rows=Object.entries(D).filter(([k,v])=>k.startsWith(pre)&&v&&v.matric&&v.score!==undefined).map(([k,v])=>[+((k.match(/Week__(\d+)_/)||[])[1]||0),v]).sort((a,b)=>a[0]-b[0]||String(a[1].name).localeCompare(b[1].name));return `<div class=card><h3>All classwork results for ${S.code} (${rows.length})</h3><p class=mut>Every result found in the database, for all weeks.</p>${rows.length?table(['Week','Name','Matric','Score','%'],rows.map(([w,v])=>[w||'?',v.name,v.matric,v.score+'/'+v.total,v.pct+'%'])):'<p class=mut>None found. If students say they submitted, run the database check below.</p>'}</div>`}
function diagCard(){return `<div class=card><h3>Database check</h3><p class=mut>Tests that this portal can save to and read from your database, and counts what is stored.</p><button class=btn onclick=runDiag()>Run check</button><pre id=dg class=pre style="margin-top:.8rem;font-size:.82rem"></pre></div>`}
async function runDiag(){const o=document.getElementById('dg');const out=m=>{o.textContent+=m+'\n'};o.textContent='';
 try{const k='lms_diag_'+S.code,w=await fetch(REST+'?on_conflict=key',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:k,value:JSON.stringify({t:Date.now()}),ts:Date.now()})});out('Write test: '+(w.ok?'OK':'FAILED HTTP '+w.status+' '+(await w.text()).slice(0,200)));
  const r=await fetch(REST+'?select=key&key=eq.'+k,{headers:H});out('Read test: '+(r.ok?'OK ('+(await r.json()).length+' row)':'FAILED HTTP '+r.status));
  const c=await fetch(REST+'?select=key&key=like.nm_cw_*&limit=1000',{headers:H});if(c.ok){const ks=(await c.json()).map(x=>x.key);out('Classwork rows in database (all courses): '+ks.filter(x=>/^nm_cw_[A-Z]+\d+_Week/.test(x)).length);out('Rows for '+S.code+': '+ks.filter(x=>x.startsWith('nm_cw_'+S.code+'_Week')).length);out('Sample keys: '+ks.filter(x=>x.startsWith('nm_cw_'+S.code+'_Week')).slice(0,3).join(' | '))}else out('Classwork count FAILED HTTP '+c.status+' '+(await c.text()).slice(0,200));
 }catch(e){out('Could not reach the database: '+e)}}
function togGate(n){const k=cwSt(S.code,n);put(k,{is_open:!cwOpen(S.code,n),opened:true,release_answers:false});render()}
/* Discussion board */
const who=p=>`${esc(p.author)}${p.role=='lect'?' <span class="pill on">Lecturer</span>':''} · ${new Date(p.ts).toLocaleString()}`;
const canDel=p=>L()||(p.role=='student'&&p.matric==S.matric);
function tDisc(){const P=R(`lms_dp_${S.code}_`),th=P.filter(p=>!p.parent).sort((a,b)=>b.ts-a.ts),db=p=>canDel(p)?` <button class="btn r s" onclick="delPost('${p.id}')">Delete</button>`:'';
 return `<div class=card><h3>Start a discussion</h3><input class=kp id=dt placeholder="Topic title"><textarea class=kp id=dm placeholder="Write your message"></textarea><button class=btn onclick=post()>Post topic</button></div>`+(th.length?th.map(p=>`<div class=card><h3>${esc(p.title)}</h3><p class=mut>${who(p)}${db(p)}</p><p class=pre>${esc(p.body)}</p>${P.filter(r=>r.parent==p.id).sort((a,b)=>a.ts-b.ts).map(r=>`<div class=reply><p class=mut>${who(r)}${db(r)}</p><p class=pre>${esc(r.body)}</p></div>`).join('')}<input class=kp id=r_${p.id} placeholder="Write a reply"><button class="btn s" onclick="reply('${p.id}')">Reply</button></div>`).join(''):'<p class=mut>No discussions yet. Start the first one.</p>')}
const mkPost=o=>{const id=uid();put(`lms_dp_${S.code}_${id}`,{id,author:L()?'Lecturer':S.name,matric:L()?'':S.matric,role:L()?'lect':'student',ts:Date.now(),...o});render()};
function post(){const t=$('dt').value.trim(),b=$('dm').value.trim();if(!t||!b)return alert('Add a title and a message.');mkPost({title:t,body:b})}
function reply(pid){const b=$('r_'+pid).value.trim();if(!b)return alert('Write a reply first.');mkPost({parent:pid,body:b})}
function delPost(id){if(!confirm('Delete this post?'))return;R(`lms_dp_${S.code}_`).filter(p=>p.id==id||p.parent==id).forEach(p=>del(`lms_dp_${S.code}_${p.id}`));render()}
/* Announcements */
function tAnn(){const a=R(`lms_ann_${S.code}_`).sort((x,y)=>y.ts-x.ts);return (L()?`<div class=card><h3>Post announcement</h3><input id=at class=kp placeholder=Title><textarea id=ab class=kp placeholder=Message></textarea><button class=btn onclick=postAnn()>Post</button></div>`:'')+(a.length?a.map(x=>`<div class=card><h3>${esc(x.t)}</h3><p class=pre>${esc(x.b)}</p><span class=mut>${new Date(x.ts).toLocaleDateString()}</span>${L()?` <button class="btn r s" onclick="delAnn('${x.id}')">Delete</button>`:''}</div>`).join(''):'<p class=mut>No announcements yet.</p>')}
function postAnn(){const t=$('at').value.trim(),b=$('ab').value.trim();if(!t||!b)return alert('Add a title and message.');const id=uid();put(`lms_ann_${S.code}_${id}`,{id,t,b,ts:Date.now()});render()}
function delAnn(id){del(`lms_ann_${S.code}_${id}`);render()}
/* Mid-semester test (taken in the portal, auto-marked) */
const T={on:false,iv:null};
const MQ=()=>({open:false,mins:30,qs:[],...(D['lms_mstq_'+S.code]||{})});
const mstKey=m=>`lms_msts_${S.code}_${mk(m)}`,stKey=()=>`lms_mstStart_${S.code}_${mk(S.matric)}`;
function tMst(){const X=MQ();
 if(!L()){const s=mstOf(S.matric);
  if(s)return `<div class=card><div class="al ok">✅ Submitted ${new Date(s.ts).toLocaleString()}</div><h3 style="margin-top:.8rem">Score: ${s.score}/${s.total} (${s.pct}%)</h3></div>`;
  if(!X.open||!X.qs.length)return `<div class=card><div class=al>🔒 The mid-semester test is not open.</div></div>`;
  let st=0;try{st=+localStorage.getItem(stKey())||0}catch(e){}
  if(!st)return `<div class=card><h3>Mid-semester test</h3><p>${X.qs.length} questions, ${X.mins} minutes. The timer starts when you press Begin and the test submits itself at zero. You can take it once.</p><button class=btn onclick=mstBegin()>Begin test</button></div>`;
  T.on=true;T.end=st+X.mins*60000;clearInterval(T.iv);T.iv=setInterval(mstTick,1000);setTimeout(mstTick,0);
  return `<div class=card><h3>Time left: <span id=mt>--:--</span></h3>${X.qs.map((q,i)=>`<p><b>${i+1}. ${esc(q.q)}</b></p>${q.o.map((o,j)=>`<label class=opt><input type=radio name=m${i} value=${j}>${esc(o)}</label>`).join('')}`).join('')}<button class=btn onclick="mstSubmit()">Submit test</button></div>`}
 const subs=R(`lms_msts_${S.code}_`).sort((a,b)=>a.ts-b.ts);
 return `<div class=card><h3>Test access <span class="pill ${X.open?'on':''}">${X.open?'Open':'Closed'}</span></h3><label>Duration (minutes)</label><input id=mm type=number min=5 value="${X.mins}"><button class=btn onclick=mstGate()>${X.open?'Close':'Open'} test</button></div>
<div class=card><h3>Add questions (${X.qs.length} so far)</h3><p class=mut>Format, one block per question:<br>MCQ: Question text?<br>A. option<br>B. option<br>C. option<br>D. option<br>Correct: B</p><textarea id=mb class=kp style="min-height:160px"></textarea><button class=btn onclick=mstBulk()>Add questions</button> ${X.qs.length?'<button class="btn r" onclick=mstClear()>Delete all</button>':''}</div>
<div class=card><h3>Questions</h3>${X.qs.map((q,i)=>`<p>${i+1}. ${esc(q.q)} <span class=mut>Answer: ${'ABCD'[q.a]}</span></p>`).join('')||'<p class=mut>None yet.</p>'}</div>
<div class=card><h3>Results (${subs.length})</h3>${subs.length?table(['Name','Matric','Score','%','Submitted'],subs.map(s=>[s.name,s.matric,s.score+'/'+s.total,s.pct+'%',new Date(s.ts).toLocaleString()])):'<p class=mut>No submissions yet.</p>'}</div>`}
function mstGate(){const X=MQ();put('lms_mstq_'+S.code,{...X,open:!X.open,mins:+$('mm').value||X.mins});render()}
function mstClear(){if(confirm('Delete all test questions?')){put('lms_mstq_'+S.code,{...MQ(),qs:[]});render()}}
function mstBulk(){const X=MQ(),qs=X.qs.slice();let n=0;$('mb').value.split(/\n(?=MCQ:)/i).forEach(b=>{const ls=b.split('\n').map(x=>x.trim()).filter(Boolean);if(!/^MCQ:/i.test(ls[0]||''))return;const q=ls[0].slice(4).trim(),o=[];let a=-1;ls.slice(1).forEach(l=>{const m=l.match(/^([A-D])[.)]\s*(.+)/i);if(m)o[m[1].toUpperCase().charCodeAt(0)-65]=m[2];else if(/^correct:/i.test(l))a=l.split(':')[1].trim().toUpperCase().charCodeAt(0)-65});if(q&&o.length==4&&o.every(Boolean)&&a>=0&&a<4){qs.push({q,o,a});n++}});if(!n)return alert('No valid questions found. Check the format.');put('lms_mstq_'+S.code,{...X,qs});render()}
function mstBegin(){try{localStorage.setItem(stKey(),Date.now())}catch(e){}render()}
function mstTick(){const e=document.getElementById('mt');if(!e)return;const r=Math.max(0,Math.round((T.end-Date.now())/1000));e.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');if(r<=0)mstSubmit(true)}
function mstSubmit(auto){const X=MQ();if(mstOf(S.matric))return;let sc=0;X.qs.forEach((q,i)=>{const r=document.querySelector(`input[name=m${i}]:checked`);if(r&&+r.value==q.a)sc++});clearInterval(T.iv);T.on=false;try{localStorage.removeItem(stKey())}catch(e){}put(mstKey(S.matric),{name:S.name,matric:S.matric,score:sc,total:X.qs.length,pct:X.qs.length?Math.round(sc/X.qs.length*100):0,ts:Date.now()});render()}
/* Continuous assessment: attendance + classwork + mid-semester test */
const CFG=()=>({att:5,cw:10,mst:15,...(D['lms_cfg_'+S.code]||{})});
function calc(){const c=CFG(),n=W.length,heldA=W.filter((w,i)=>D[`lms_atts_${S.code}_W${i+1}`]).length,heldC=W.filter((w,i)=>{const x=D[cwSt(S.code,i+1)];return x&&(x.opened||x.is_open===true)}).length,st={};
 W.forEach((w,i)=>{R(`lms_att_${S.code}_W${i+1}_`).concat(R(fk(`nm_cw_${S.code}_Week ${i+1}_`))).forEach(r=>{if(r&&r.matric&&!st[nm_(r.matric)])st[nm_(r.matric)]={name:r.name,matric:r.matric}})});R(`lms_msts_${S.code}_`).forEach(r=>{if(!st[nm_(r.matric)])st[nm_(r.matric)]={name:r.name,matric:r.matric}});
 const rd=x=>Math.round(x*10)/10,rows=Object.values(st).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>{const att=W.map((w,i)=>attHas(S.code,i+1,s.matric)?1:0),cw=W.map((w,i)=>{const x=subOf(S.code,i+1,s.matric);return x?x.pct:null}),m=mstOf(s.matric),pres=att.reduce((a,b)=>a+b,0),ap=heldA?Math.min(100,pres/heldA*100):0,cn=Math.max(heldC,cw.filter(x=>x!==null).length),cp=cn?cw.reduce((a,b)=>a+(b||0),0)/cn:0,mp=m?m.pct:0,pa=rd(ap*c.att/100),pc=rd(cp*c.cw/100),pm=rd(mp*c.mst/100);return {...s,att,cw,pres,ap:rd(ap),cp:rd(cp),m,mp,pa,pc,pm,tot:rd(pa+pc+pm)}});
 return {c,rows,heldA,heldC,n}}
function tGrades(){const {c,rows,heldA,heldC}=calc(),tot=c.att+c.cw+c.mst;
 return `<div class=card><h3>Continuous assessment weights</h3><p class=mut>Attendance, classwork and the mid-semester test together make up the continuous assessment mark (default 30).</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem"><div><label>Attendance</label><input id=wa type=number min=0 value="${c.att}"></div><div><label>Classwork</label><input id=wc type=number min=0 value="${c.cw}"></div><div><label>Mid-semester test</label><input id=wm type=number min=0 value="${c.mst}"></div></div><button class=btn onclick=saveCfg()>Save weights (total ${tot})</button></div>
<div class=card><h3>Scores for all students (${rows.length})</h3><p class=mut>Attendance is counted over ${heldA} week(s) held and classwork over ${heldC} week(s) opened. A missed classwork or test counts as zero.</p><div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem"><button class=btn onclick=dlExcel()>⬇ Download Excel</button><button class="btn y" onclick=dlCsv()>⬇ Download CSV</button></div>${rows.length?table(['Name','Matric','Attendance',`Att /${c.att}`,'Classwork %',`CW /${c.cw}`,'MST %',`MST /${c.mst}`,`Total /${tot}`],rows.map(r=>[r.name,r.matric,r.pres+'/'+heldA,r.pa,r.cp+'%',r.pc,r.m?r.mp+'%':'—',r.pm,r.tot])):'<p class=mut>No student activity yet.</p>'}</div>`}
function saveCfg(){put('lms_cfg_'+S.code,{att:+$('wa').value||0,cw:+$('wc').value||0,mst:+$('wm').value||0});render()}
function tables(){const {c,rows,n}=calc(),tot=c.att+c.cw+c.mst,wk=p=>W.map((w,i)=>p+(i+1)),
 sum=[['Name','Matric','Weeks present','Attendance %','Attendance /'+c.att,'Classwork avg %','Classwork /'+c.cw,'MST score','MST %','MST /'+c.mst,'Total /'+tot]].concat(rows.map(r=>[r.name,r.matric,r.pres,r.ap,r.pa,r.cp,r.pc,r.m?r.m.score+'/'+r.m.total:'',r.mp,r.pm,r.tot])),
 att=[['Name','Matric',...wk('Week '),'Weeks present']].concat(rows.map(r=>[r.name,r.matric,...r.att.map(x=>x?'P':'A'),r.pres])),
 cw=[['Name','Matric',...wk('Week '),'Average %']].concat(rows.map(r=>[r.name,r.matric,...r.cw.map(x=>x===null?'':x),r.cp])),
 all=[['Name','Matric',...wk('Att W'),'Weeks present','Attendance %','Attendance /'+c.att,...wk('CW W'),'Classwork avg %','Classwork /'+c.cw,'MST score','MST %','MST /'+c.mst,'Total /'+tot]].concat(rows.map(r=>[r.name,r.matric,...r.att.map(x=>x?'P':'A'),r.pres,r.ap,r.pa,...r.cw.map(x=>x===null?'':x),r.cp,r.pc,r.m?r.m.score+'/'+r.m.total:'',r.mp,r.pm,r.tot]));return {sum,att,cw,all}}
function save1(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function dlCsv(){const t=tables().all;save1(new Blob(['\ufeff'+t.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv'}),`${S.code}_attendance_and_scores.csv`)}
function dlExcel(){if(typeof XLSX==='undefined'){alert('Excel export did not load, so a CSV was downloaded instead.');return dlCsv()}const t=tables(),wb=XLSX.utils.book_new();[['Summary',t.sum],['Attendance',t.att],['Classwork',t.cw]].forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n));XLSX.writeFile(wb,`${S.code}_attendance_and_scores.xlsx`)}
/* Student progress */
function tProg(){const {c,rows,heldA}=calc(),r=rows.find(x=>nm_(x.matric)==nm_(S.matric)),dp=R(`lms_dp_${S.code}_`).filter(p=>p.matric==S.matric).length,tot=c.att+c.cw+c.mst,
 k=(h,v,p)=>`<div class=card><h3>${h}</h3><b style="font-size:1.8rem;color:var(--g)">${v}</b>${p!=null?`<div class=bar><i style="width:${Math.min(100,p)}%"></i></div>`:''}</div>`;
 return `<div class=grid>${k('Attendance',(r?r.pres:0)+'/'+heldA+' weeks',r?r.ap:0)}${k('Classwork average',(r?r.cp:0)+'%',r?r.cp:0)}${k('Mid-semester test',r&&r.m?r.m.score+'/'+r.m.total:'—',r&&r.m?r.mp:0)}${k('Continuous assessment',(r?r.tot:0)+' / '+tot,tot?(r?r.tot:0)/tot*100:0)}${k('Discussion posts',dp)}</div><p class=mut>Continuous assessment = attendance (${c.att}) + classwork (${c.cw}) + mid-semester test (${c.mst}).</p>`}
/* Boot: show cached data instantly, then sync and keep refreshing */
const busy=()=>T.on||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)||[...document.querySelectorAll('.kp')].some(x=>x.value);
async function tick(){const sy=document.getElementById('sy');if(sy)sy.textContent='● Syncing…';try{const ch=await pull();for(const k of Object.keys(PEND))await put(k,PEND[k]);if(Object.keys(PEND).length)sync(false,'Some changes are saved on this device and are still waiting to reach the cloud.');else sync(true);if(ch&&S.view!='login'&&!busy())render()}catch(e){sync(false,'Cannot reach the cloud ('+e+'). Showing saved data. Check the internet connection; if it keeps failing, the Supabase project may be paused.')}}
$('ft').innerHTML=`<div class=fl>${LOGO(22)} Powered by <a href="${SITE}" target=_blank rel=noopener>NeuroMatrix Biosystems</a> · 2026</div>Developed by ${AUTHOR} · <a href="${SITE}" target=_blank rel=noopener>neuromatrixbiosystems.com</a><br>Sikiru Adetona College of Education, Science and Technology, Omu-Ijebu-Ode`;
render();tick();setInterval(tick,8000);
</script></body></html>
